name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    # Use the current macOS runner for its recent Xcode. The app itself targets
    # macOS 13.7; the newer runner is only needed to generate and build the
    # project with the repository's current Xcode project format.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Printed rather than assumed: when this job fails on a runner image
      # change, the toolchain is the first thing worth seeing.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check local signing detection
        run: bash Scripts/test-signing.sh

      # Unsigned on purpose: no identity exists on a runner, and the tests
      # read fixtures rather than keychains — see `make test-ci`.
      - name: Run unit tests
        run: make test-ci

      - name: Verify SwiftPM resolution
        run: make verify-deps
